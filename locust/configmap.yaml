apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts
  namespace: locust
data:
  locustfile.py: |
    """
    Locust load test — ccf_gru_static GRU ONNX fraud detection model
    served by OpenVINO Model Server (OVMS) via Red Hat OpenShift AI.

    Model spec (from ccf_220_keras_gru_static-OS.ipynb):
      input  name="input"  shape=(7, 16, 220)  float32
      output               shape=(7, 16, 1)    float32

    Cluster: <CLUSTER_DOMAIN>
    """
    import os
    import json
    import numpy as np
    from locust import HttpUser, task, between, events

    MODEL_NAME    = "ccf_gru_static"
    MODEL_VERSION = "1"
    INPUT_NAME    = "input"
    TIME_STEPS    = 7
    BATCH_SIZE    = 16
    FEATURES      = 220

    INFER_URL = f"/v2/models/{MODEL_NAME}/versions/{MODEL_VERSION}/infer"

    # Bearer token injected via LOCUST_TOKEN env var in the worker Deployment
    BEARER_TOKEN = os.environ.get("LOCUST_TOKEN", "")

    def make_payload():
        data = np.random.rand(TIME_STEPS, BATCH_SIZE, FEATURES).astype(np.float32)
        return {
            "inputs": [{
                "name":     INPUT_NAME,
                "shape":    [TIME_STEPS, BATCH_SIZE, FEATURES],
                "datatype": "FP32",
                "data":     data.flatten().tolist(),
            }]
        }

    class FraudModelUser(HttpUser):
        wait_time = between(0.1, 1.0)

        def on_start(self):
            # Disable TLS check — <KVM_HOST> uses a self-signed ingress cert
            self.client.verify = False
            if BEARER_TOKEN:
                self.client.headers.update(
                    {"Authorization": f"Bearer {BEARER_TOKEN}"}
                )

        @task
        def infer(self):
            with self.client.post(
                INFER_URL,
                json=make_payload(),
                catch_response=True,
                name="/v2/models/ccf_gru_static/infer",
            ) as resp:
                if resp.status_code == 200:
                    try:
                        outputs = resp.json()["outputs"][0]["data"]
                        if len(outputs) != TIME_STEPS * BATCH_SIZE:
                            resp.failure(f"Unexpected output length: {len(outputs)}")
                        else:
                            resp.success()
                    except (KeyError, ValueError) as exc:
                        resp.failure(f"Bad JSON: {exc}")
                else:
                    resp.failure(f"HTTP {resp.status_code}: {resp.text[:200]}")
