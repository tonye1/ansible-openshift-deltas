version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel9:latest

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.15.0,<2.16.0
  ansible_runner:
    package_pip: ansible-runner>=2.3.0,<2.4.0
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_steps:
  prepend_base:
    - RUN microdnf install -y python3-pip python3-wheel python3-setuptools gcc gcc-c++ python3-devel libffi-devel openssl-devel && microdnf clean all
  prepend_final:
    - RUN pip3 install --upgrade pip setuptools wheel
  append_final:
    - RUN chmod -R g+w /runner
    - RUN microdnf clean all

options:
  package_manager_path: /usr/bin/microdnf
  user: root
